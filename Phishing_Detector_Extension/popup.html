<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <h1>Phishing Detector</h1>
  </div>

  <div class="verdict-row">
    <div id="verdict-icon" class="verdict-icon"></div>
    <div>
      <div id="verdict-text" class="verdict-text">Checking this page...</div>
      <div id="risk-level-label" class="risk-level-label">—</div>
    </div>
  </div>

  <div class="gauge-wrap">
    <svg id="gauge-svg" viewBox="0 0 200 110" xmlns="http://www.w3.org/2000/svg">
      <!-- 5 colored arc segments -->
      <path d="M 42.00 95.00 L 20.00 95.00 A 80 80 0 0 1 35.28 47.98 L 53.08 60.91 A 58 58 0 0 0 42.00 95.00 Z" fill="#2e7d32" />
      <path d="M 53.08 60.91 L 35.28 47.98 A 80 80 0 0 1 75.28 18.92 L 82.08 39.84 A 58 58 0 0 0 53.08 60.91 Z" fill="#8bc34a" />
      <path d="M 82.08 39.84 L 75.28 18.92 A 80 80 0 0 1 124.72 18.92 L 117.92 39.84 A 58 58 0 0 0 82.08 39.84 Z" fill="#fdd835" />
      <path d="M 117.92 39.84 L 124.72 18.92 A 80 80 0 0 1 164.72 47.98 L 146.92 60.91 A 58 58 0 0 0 117.92 39.84 Z" fill="#fb8c00" />
      <path d="M 146.92 60.91 L 164.72 47.98 A 80 80 0 0 1 180.00 95.00 L 158.00 95.00 A 58 58 0 0 0 146.92 60.91 Z" fill="#e53935" />

      <!-- needle: pivot at (100,95), points up by default (rotated via JS/CSS transform) -->
      <g id="needle-group" transform="rotate(0 100 95)">
        <line x1="100" y1="95" x2="100" y2="28" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" />
        <circle cx="100" cy="95" r="7" fill="#2b2b2b" />
      </g>
    </svg>
    <div class="gauge-scale">
      <span>Very Low</span>
      <span>Severe</span>
    </div>
  </div>

  <div class="reasons">
    <h2>Details</h2>
    <ul id="reasons-list">
      <li class="muted">No issues found yet.</li>
    </ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
